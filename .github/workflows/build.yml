name: Build Garantgram iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.1.app/Contents/Developer"
            echo "DEVELOPER_DIR=/Applications/Xcode_16.1.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.0.app/Contents/Developer"
            echo "DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer" >> $GITHUB_ENV
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          # Patch provisioning profile expiration check
          python3 -c '
          import glob
          for p in glob.glob("build-system/fake-codesigning/profiles/*.mobileprovision"):
              with open(p, "rb") as f:
                  d = f.read()
              if b"2026-10-30" in d:
                  with open(p, "wb") as f:
                      f.write(d.replace(b"2026-10-30", b"2036-10-30"))
          tool_path = "build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py"
          try:
              with open(tool_path, "r") as f:
                  c = f.read()
              c = c.replace("if expire and expire < datetime.datetime.now():", "if False and expire < datetime.datetime.now():")
              with open(tool_path, "w") as f:
                  f.write(c)
          except Exception as e:
              print(e)
          '

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.ipa bazel-bin/Telegram/*.ipa; do
            if [ -f "$f" ]; then
              cp "$f" "$OUTPUT_PATH/Garantgram.ipa"
              cp "$f" "$OUTPUT_PATH/Telegram.ipa"
            fi
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM bazel-bin/Telegram/*.dSYM; do
            if [ -f "$f" ]; then
              cp -R "$f" build/DSYMs/
            fi
          done
          zip -r "./$OUTPUT_PATH/Garantgram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garantgram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Garantgram.ipa

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /Users/Shared/telegram-ios/build/artifacts
          gh release create "build-${{ env.BUILD_NUMBER }}" \
            Garantgram.ipa \
            Garantgram.DSYMs.zip \
            --title "Garantgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})" \
            --notes "Garantgram for iOS (${{ env.APP_VERSION }}) - Ghost Mode and No-Ads"
